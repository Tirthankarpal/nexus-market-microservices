server:
  port: 8000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:4200"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
      server:
        webflux:
          routes:
            # Route for Authentication
            - id: auth-service-route
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            # Route for Products
            - id: product-service-route
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/v1/products, /api/v1/products/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productCircuitBreaker
                    fallbackUri: forward:/fallback/product

            # Route for Orders
            - id: order-service-route
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/v1/orders, /api/v1/orders/**

            # Route for Inventory
            - id: inventory-service-route
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/api/v1/inventory, /api/v1/inventory/**

# These settings enable the route debugging endpoint
management:
  endpoints:
    web:
      exposure:
        include: "gateway,health,info"
  endpoint:
    gateway:
      access: unrestricted

eureka:
  client:
    service-url:
      # CRITICAL: Use 'discovery-server' (Docker service name), not 'localhost'
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

# Your JWT settings
jwt:
  secret: ${JWT_SECRET}

# Resilience4j config (for CircuitBreaker fallback)
resilience4j:
  circuitbreaker:
    instances:
      productCircuitBreaker:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3