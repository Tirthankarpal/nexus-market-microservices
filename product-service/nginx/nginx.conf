events {
    worker_connections 1024;
}

http {
    # Disable server tokens for production security
    server_tokens off;

upstream nexus_market_servers {
    server host.docker.internal:8081;
    server host.docker.internal:8082; # Added a second local instance
}

    server {
        listen 80;

        location / {
            proxy_pass http://nexus_market_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}