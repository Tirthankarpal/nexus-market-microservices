spring.application.name=auth-service
# Spring will look for an environment variable named JWT_SECRET first.
# If it's running locally outside Docker, it will use the fallback value after the colon.
jwt.secret=${JWT_SECRET}
# Database Connection (with local fallbacks for testing)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Tells Spring/Hibernate to automatically create our 'user_credentials' table
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Change from localhost to discovery-server
eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/
# Set the port for this specific microservice so it doesn't clash with others
server.port=8082