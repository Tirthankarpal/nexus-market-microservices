services:
  postgres:
    image: postgres:17-alpine
    container_name: nexus-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTH_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d/:ro
    deploy:
      resources:
        limits:
          memory: 128M
    restart: always

  discovery-server:
    build: ./discovery-server
    container_name: discovery-server
    environment:
      - EUREKA_PASSWORD=${EUREKA_PASSWORD}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss256k -XX:ActiveProcessorCount=1
    ports:
      - "127.0.0.1:8761:8761"
    deploy:
      resources:
        limits:
          memory: 192M
    restart: always

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss256k -XX:ActiveProcessorCount=1
    depends_on:
      - discovery-server
    deploy:
      resources:
        limits:
          memory: 192M
    restart: always

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${PRODUCT_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss256k -XX:ActiveProcessorCount=1
    depends_on:
      - postgres
      - discovery-server
    deploy:
      resources:
        limits:
          memory: 192M
    restart: always

  auth-service:
    build: ./auth-service
    container_name: auth-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - DB_URL=jdbc:postgresql://postgres:5432/${AUTH_DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss256k -XX:ActiveProcessorCount=1
    depends_on:
      - postgres
      - discovery-server
    deploy:
      resources:
        limits:
          memory: 192M
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: nexus-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFICES: 'CONTROLLER://kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_HEAP_OPTS: "-Xmx192m -Xms192m"
      KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:+UseSerialGC -Djava.awt.headless=true"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always

  inventory-service:
    build: ./inventory-service
    container_name: inventory-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${INVENTORY_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss256k -XX:ActiveProcessorCount=1
    depends_on:
      - postgres
      - discovery-server
    deploy:
      resources:
        limits:
          memory: 192M
    restart: always

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${ORDER_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss256k -XX:ActiveProcessorCount=1
    depends_on:
      - postgres
      - discovery-server
      - kafka
    deploy:
      resources:
        limits:
          memory: 192M
    restart: always

  notification-service:
    build: ./notification-service
    container_name: notification-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=${EUREKA_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - JAVA_TOOL_OPTIONS=-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -Xss256k -XX:ActiveProcessorCount=1
    depends_on:
      - discovery-server
      - kafka
    deploy:
      resources:
        limits:
          memory: 192M
    restart: always

  nexus-frontend:
    build:
      context: ../nexus-market-frontend
      args:
        - VITE_API_BASE=
    container_name: nexus-frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api-gateway
    deploy:
      resources:
        limits:
          memory: 64M
    restart: always

volumes:
  postgres_data:
